name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  fetch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download official test suite
        run: |
          BASE_URL="https://raw.githubusercontent.com/json-logic/.github/main/tests"
          TREE_API="https://api.github.com/repos/json-logic/.github/git/trees/main?recursive=1"
          mkdir -p official-tests
          while read -r rel; do
            mkdir -p "official-tests/$(dirname "$rel")"
            curl -sSf "$BASE_URL/$rel" > "official-tests/$rel"
          done < <(curl -sSf "$TREE_API" \
            | grep '"path": "tests/.*\.json"' \
            | sed 's/.*"path": "tests\///;s/"[,]*//')

      - name: Upload test suite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-tests
          path: official-tests/

  test:
    needs: fetch-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download test suite artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-tests
          path: official-tests/

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit

      - name: Run official test suite
        run: bash run-official-tests.sh --no-docker --test-dir official-tests

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  fetch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download official test suite
        run: |
          BASE_URL="https://raw.githubusercontent.com/json-logic/.github/main/tests"
          TREE_API="https://api.github.com/repos/json-logic/.github/git/trees/main?recursive=1"
          mkdir -p official-tests
          while read -r rel; do
            mkdir -p "official-tests/$(dirname "$rel")"
            curl -sSf "$BASE_URL/$rel" > "official-tests/$rel"
          done < <(curl -sSf "$TREE_API" \
            | grep '"path": "tests/.*\.json"' \
            | sed 's/.*"path": "tests\///;s/"[,]*//')

      - name: Upload test suite artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-tests
          path: official-tests/

  test:
    needs: fetch-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download test suite artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: official-tests
          path: official-tests/

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit

      - name: Run official test suite
        run: bash run-official-tests.sh --no-docker --test-dir official-tests
